name: Build ArgentAI Fabric 1.20.1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ArgentAI-Fabric-1.20.1-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Extract ArgentAI source ZIP
        run: |
          test -f ArgentAI-Fabric-1.20.1-source.zip
          mkdir -p extracted
          unzip -q ArgentAI-Fabric-1.20.1-source.zip -d extracted
          test -f extracted/ArgentAI-Fabric-1.20.1/build.gradle

      - name: Build mod JAR
        working-directory: extracted/ArgentAI-Fabric-1.20.1
        run: gradle build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ArgentAI-Fabric-1.20.1-JAR
          path: extracted/ArgentAI-Fabric-1.20.1/build/libs/*.jar
          if-no-files-found: error
          
